<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AR Gallery - Ultra Optimized</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    
    <link rel="manifest" href="manifest.json">
    <link href="css/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <script src="js/webxr-polyfill.js" defer></script> 
    
    <style>
        body { font-family: 'Vazirmatn', sans-serif; margin: 0; overflow: hidden; background-color: transparent; user-select: none; -webkit-tap-highlight-color: transparent; color: white; touch-action: none; }
        #bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: -1; }
        #ar-container { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 1; touch-action: none; }
        #ar-container canvas { display: block; width: 100% !important; height: 100% !important; }
        
        #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        #touch-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; touch-action: none; pointer-events: auto; }
        
        .ui-hidden .ui-top-bar, .ui-hidden .ui-bottom-controls { display: none !important; opacity: 0; pointer-events: none !important; transition: none; }
        
        .ui-top-bar { padding: 15px; padding-top: max(15px, env(safe-area-inset-top)); display: flex; justify-content: space-between; pointer-events: auto; z-index: 10; transition: opacity 0.3s; }
        .ui-top-bar-left, .ui-top-bar-right { display: flex; gap: 10px; }
        
        .ui-bottom-controls { padding: 10px 15px; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); pointer-events: auto; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; width: 100%; box-sizing: border-box; padding-bottom: max(20px, env(safe-area-inset-bottom)); z-index: 10; transition: opacity 0.3s; }
        
        .btn-icon { background: rgba(40, 40, 40, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.2s, background 0.3s; pointer-events: auto; padding: 0; margin: 0; }
        .btn-icon:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.3); }
        .btn-icon.active-mode { background: #3b82f6; border-color: #60a5fa; }
        .btn-icon.exit-mode { background: rgba(220, 38, 38, 0.8); border-color: #f87171; }
        .hidden { display: none !important; }
        .btn-label { background: #2563eb; color: white; padding: 8px 16px; border-radius: 30px; display: flex; align-items: center; gap: 10px; font-weight: bold; cursor: pointer; transition: transform 0.2s; pointer-events: auto; font-size: 0.9rem; }
        .controls-row { display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 40px; flex-wrap: wrap; justify-content: center; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; margin-top: -6px; border: 1px solid white; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #4b5563; border-radius: 2px; }
        
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; display: none; justify-content: center; align-items: center; padding: 20px; pointer-events: auto; box-sizing: border-box; }
        .modal-content { background: #1f2937; color: white; padding: 25px; border-radius: 20px; max-width: 400px; width: 100%; border: 1px solid #374151; text-align: right; overflow-y: auto; max-height: 80vh; -webkit-overflow-scrolling: touch; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #374151; padding-bottom: 10px; }
        .modal-title { font-size: 1.1rem; font-weight: bold; color: #60a5fa; margin: 0; }
        
        #temp-reveal-btn { position: absolute; top: max(80px, env(safe-area-inset-top)); right: 20px; z-index: 100; display: none; padding: 12px 25px; background: rgba(37, 99, 235, 0.9); color: white; font-weight: bold; font-size: 1rem; border: 1px solid rgba(255,255,255,0.3); border-radius: 30px; pointer-events: auto; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        #touch-status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.6); color: white; padding: 10px 20px; border-radius: 20px; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 20; font-size: 0.9rem; }
        
        .radio-group { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .radio-item { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .radio-item:hover { background: rgba(255,255,255,0.1); }
        .radio-item input { width: 20px; height: 20px; accent-color: #3b82f6; }
        
        #custom-ar-btn { position: absolute; bottom: 80px; right: 30px; padding: 12px 30px; border: 1px solid rgba(255,255,255,0.5); border-radius: 25px; background: rgba(0,0,0,0.8); color: white; font-family: 'Vazirmatn', sans-serif; font-size: 14px; font-weight: bold; z-index: 50; cursor: pointer; transition: all 0.2s; }
        #custom-ar-btn:active { transform: scale(0.95); background: rgba(37, 99, 235, 0.8); }
        
        .w-full { width: 100%; } .flex { display: flex; } .items-center { align-items: center; } .gap-3 { gap: 12px; } .text-xs { font-size: 0.75rem; } .text-white { color: white; } .bg-black\/60 { background-color: rgba(0,0,0,0.6); } .rounded-full { border-radius: 9999px; } .p-2 { padding: 0.5rem; } .flex-grow { flex-grow: 1; } .mb-2 { margin-bottom: 0.5rem; } .mb-4 { margin-bottom: 0.5rem; } .justify-end { justify-content: flex-end; } .flex-col { flex-direction: column; } #cube-shape-btn { width: 50px; height: 50px; } #cube-shape-btn svg { width: 26px; height: 26px; }
    </style>
</head>
<body id="app-body">
    
    <div id="bg-layer"></div>
    <div id="ar-container"></div>
    <div id="touch-status">وضعیت</div>
    <button id="custom-ar-btn">ورود به AR (فوق سبک)</button>

    <div id="ui-layer">
        <div id="touch-layer"></div>
        <button id="temp-reveal-btn">آشکارسازی دکمه‌ها</button>
        
        <div class="ui-top-bar">
            <div class="ui-top-bar-left">
                <button id="exit-btn" class="btn-icon exit-mode" title="خروج"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/><path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/></svg></button>
                <button id="about-btn" class="btn-icon" title="درباره ما"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 1 1-2 0 1 1 0 0 1 2 0z"/></svg></button>
                <button id="settings-btn" class="btn-icon" title="تنظیمات"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1-1.255-.52l-.094-.319z"/></svg></button>
            </div>
            <div class="ui-top-bar-right">
                <button id="clean-view-btn" class="btn-icon hidden" title="پنهان شدن دکمه‌ها"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/><path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8zm8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg></button>
            </div>
        </div>

        <div class="ui-bottom-controls">
            <div id="dist-container" class="w-full px-8 hidden mb-2">
                <div class="flex items-center gap-3 w-full bg-black/60 p-2 rounded-full border border-gray-600">
                    <span class="text-xs text-yellow-400 font-bold whitespace-nowrap">فاصله:</span>
                    <input type="range" id="dist-slider" min="0.5" max="5.0" value="1.0" step="0.1" class="flex-grow">
                </div>
            </div>

            <div id="seek-container" class="w-full px-8 hidden mb-2">
                <div class="flex items-center gap-2 w-full bg-black/40 p-2 rounded-full">
                    <span id="current-time" class="text-xs text-white min-w-[35px] text-center">0:00</span>
                    <input type="range" id="seek-bar" min="0" value="0" step="0.1" class="flex-grow">
                    <span id="duration-time" class="text-xs text-white min-w-[35px] text-center">0:00</span>
                </div>
            </div>
            
            <div class="w-full flex justify-end px-8 mb-4">
                <label id="file-label" class="btn-label">
                    <span>انتخاب ویدیو یا عکس</span>
                    <input type="file" id="file-input" accept="video/*,image/*" style="display: none;">
                </label>
            </div>

            <div id="controls-panel" class="flex flex-col gap-3 items-center hidden w-full">
                <div class="controls-row">
                    <button id="play-btn" class="btn-icon" style="width: 50px; height: 50px; background: #2563eb; display:none;">
                         <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="M6.271 5.055a.5.5 0 0 1 .52.038l3.5 2.5a.5.5 0 0 1 0 .814l-3.5 2.5A.5.5 0 0 1 6 10.5v-5a.5.5 0 0 1 .271-.445z"/></svg>
                         <svg id="pause-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="M5 6.25a1.25 1.25 0 1 1 2.5 0v3.5a1.25 1.25 0 1 1-2.5 0v-3.5zm3.5 0a1.25 1.25 0 1 1 2.5 0v3.5a1.25 1.25 0 1 1-2.5 0v-3.5z"/></svg>
                    </button>
                </div>
                <div id="size-controls" class="controls-row mt-2" style="display: none;">
                    <button id="reset-btn" class="btn-icon" title="بازنشانی کامل"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg></button>
                    <button id="cube-shape-btn" class="btn-icon" title="تبدیل به مکعب سه بعدی"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16"><path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2l-2.218-.887zm3.564 1.426L5.596 5 8 5.961 14.154 3.5l-2.404-.961zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923l6.5 2.6zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464L7.443.184z"/></svg></button>
                    <button id="stretch-btn" class="btn-icon" title="تغییر سایز آزاد"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h13a.5.5 0 0 1 0 1h-13A.5.5 0 0 1 1 8z"/><path fill-rule="evenodd" d="M13.5 12.5a.5.5 0 0 1 0-1l2 1.5-2 1.5a.5.5 0 0 1 0-1V12.5zM2.5 12.5V13a.5.5 0 0 1 0 1l-2-1.5 2-1.5a.5.5 0 0 1 0 1v.5z"/><path d="M2.5 3.5a.5.5 0 0 1 0 1l-2-1.5 2-1.5a.5.5 0 0 1 0 1v.5zm11 0v-.5a.5.5 0 0 1 0-1l2 1.5-2 1.5a.5.5 0 0 1 0-1v-.5z"/></svg></button>
                </div>
            </div>
        </div>

        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">تنظیمات آشکارسازی</h3>
                    <button id="close-settings-btn" style="background:none; border:none; color:white; font-size:1.5rem;">&times;</button>
                </div>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="reveal-mode" value="button" checked><span>نمایش دکمه موقت با لمس</span></label>
                    <label class="radio-item"><input type="radio" name="reveal-mode" value="gesture"><span>چهار انگشت همزمان روی صفحه</span></label>
                </div>
            </div>
        </div>
        
        <div id="about-modal" class="modal">
            <div class="modal-content" style="text-align: center;">
                <div class="modal-header" style="justify-content: center; position: relative;">
                    <h3 class="modal-title">درباره ما</h3>
                    <button id="close-about-btn" style="background:none; border:none; color:white; font-size:1.5rem; position: absolute; left: 0;">&times;</button>
                </div>
                <p>ساخته شده برای اجرای بهینه فایل‌های ۲ بعدی در AR</p>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from './js/three.module.js';

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js').catch(e => console.log(e)); }); }
        
        function hideNonARUI(){ try{ document.getElementById('bg-layer').style.display = 'none'; }catch(e){} }
        function showToast(msg) { touchStatus.innerText = msg; touchStatus.style.opacity = '1'; setTimeout(() => { touchStatus.style.opacity = '0'; }, 2500); }
        function formatTime(seconds) { const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); return `${m}:${s < 10 ? '0' : ''}${s}`; }

        let camera, scene, renderer, currentMesh = null, currentVideo = null, currentImageTexture = null, currentSession = null;
        let isStretchMode = false, isCubeMode = false, currentOriginalWidth = 1, currentOriginalHeight = 1;
        let isDragging = false, previousMousePosition = { x: 0, y: 0 };
        let initialPinchDistance = 0, initialScale = new THREE.Vector3(), initialAngle = 0, initialMeshPosition = new THREE.Vector3(), gestureType = null;
        let uiHidden = false, revealMode = 'button', revealTimer = null, needsArReposition = false, lastRenderTime = 0; 
        
        const fileInput = document.getElementById('file-input'), controlsPanel = document.getElementById('controls-panel'), distSlider = document.getElementById('dist-slider'), playBtn = document.getElementById('play-btn'), playIcon = document.getElementById('play-icon'), pauseIcon = document.getElementById('pause-icon'), seekBar = document.getElementById('seek-bar'), currentTimeEl = document.getElementById('current-time'), durationTimeEl = document.getElementById('duration-time'), touchStatus = document.getElementById('touch-status'), tempRevealBtn = document.getElementById('temp-reveal-btn'), customArBtn = document.getElementById('custom-ar-btn'), cubeShapeBtn = document.getElementById('cube-shape-btn');
        const touchLayer = document.getElementById('touch-layer');

        init(); 

        function init() {
            const container = document.getElementById('ar-container');
            scene = new THREE.Scene(); scene.matrixAutoUpdate = false; 
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
            
            // نهایت بهینه‌سازی پردازش گرافیکی
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: "low-power", precision: "lowp", depth: false, stencil: false });
            renderer.setClearColor(0x000000, 0); 
            
            // قفل کردن تراکم پیکسلی برای جلوگیری از فشار به گوشی در حالت عادی
            renderer.setPixelRatio(0.5); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
            renderer.xr.enabled = true; 
            renderer.xr.setReferenceSpaceType('local');
            
            // کاهش شدید رزولوشن در حالت AR
            try { renderer.xr.setFramebufferScaleFactor(0.2); } catch (e) { } 
            
            container.appendChild(renderer.domElement);
            renderer.setAnimationLoop(render);

            customArBtn.addEventListener('click', async () => {
                if (!currentMesh) { showToast("لطفا ابتدا فایل را انتخاب کنید"); return; }
                if (currentSession === null) {
                    const sessionInit = { requiredFeatures: ['local'], optionalFeatures: ['dom-overlay'], domOverlay: { root: document.getElementById('ui-layer') } };
                    try {
                        const session = await navigator.xr.requestSession('immersive-ar', sessionInit);
                        await renderer.xr.setSession(session); 
                        currentSession = session; hideNonARUI(); 
                        customArBtn.style.display = 'none'; document.getElementById('exit-btn').style.display = 'none';
                        showToast("حالت AR (سبک) فعال شد"); needsArReposition = true; 
                        session.addEventListener('end', () => { window.location.replace(window.location.pathname); });
                    } catch (e) { showToast("خطا در اجرای AR"); }
                }
            });
            setupUIListeners(); setupTouchGestures();
        }

        function repositionObject() {
            if (!currentMesh) return;
            const direction = new THREE.Vector3(); camera.getWorldDirection(direction); direction.y = 0; direction.normalize();
            const targetPos = new THREE.Vector3(); targetPos.copy(camera.position).add(direction.multiplyScalar(parseFloat(distSlider.value)));
            currentMesh.position.copy(targetPos); currentMesh.updateMatrix(); 
        }

        function render(timestamp, frame) { 
            if (renderer.xr.isPresenting) {
                if (!frame) return;
                if (needsArReposition) { repositionObject(); needsArReposition = false; }
                renderer.render(scene, camera);
            } else {
                if (!currentMesh) return; 
                // محدود کردن فریم ریت در حالت غیر AR برای جلوگیری از داغ شدن
                if (timestamp - lastRenderTime < 45) return; 
                lastRenderTime = timestamp;
                renderer.render(scene, camera);
            }
        }
        
        function setupUIListeners() {
            document.getElementById('exit-btn').addEventListener('click', () => { window.close(); });
            document.getElementById('about-btn').addEventListener('click', () => document.getElementById('about-modal').style.display = 'flex'); document.getElementById('close-about-btn').addEventListener('click', () => document.getElementById('about-modal').style.display = 'none');
            fileInput.addEventListener('change', handleFileSelect);
            document.getElementById('clean-view-btn').addEventListener('click', () => { uiHidden = true; document.body.classList.add('ui-hidden'); showToast("منوها پنهان شدند"); });
            tempRevealBtn.addEventListener('click', revealUI);
            document.getElementById('settings-btn').addEventListener('click', () => document.getElementById('settings-modal').style.display = 'flex'); document.getElementById('close-settings-btn').addEventListener('click', () => document.getElementById('settings-modal').style.display = 'none');
            document.querySelectorAll('input[name="reveal-mode"]').forEach(r => r.addEventListener('change', (e) => revealMode = e.target.value));
            
            playBtn.addEventListener('click', () => { if (currentVideo) { if (currentVideo.paused) { currentVideo.play(); playIcon.classList.add('hidden'); pauseIcon.classList.remove('hidden'); } else { currentVideo.pause(); playIcon.classList.remove('hidden'); pauseIcon.classList.add('hidden'); } } });
            seekBar.addEventListener('input', () => { if (currentVideo) currentVideo.currentTime = seekBar.value; });
            distSlider.addEventListener('input', (e) => { if (renderer.xr.isPresenting && currentMesh) repositionObject(); else if (currentMesh) { currentMesh.position.z = -parseFloat(e.target.value); currentMesh.updateMatrix(); } });
            
            document.getElementById('reset-btn').addEventListener('click', () => { if (currentMesh) { distSlider.value = 1.0; if (renderer.xr.isPresenting) repositionObject(); else { currentMesh.position.set(0, 0, -1.0); } currentMesh.scale.set(1, 1, 1); currentMesh.updateMatrix(); showToast("بازنشانی شد"); } });
            
            cubeShapeBtn.addEventListener('click', () => { if (!currentMesh) return; isCubeMode = !isCubeMode; cubeShapeBtn.classList.toggle('active-mode', isCubeMode); try { currentMesh.geometry.dispose(); } catch(e){} if (isCubeMode) { const depth = Math.min(currentOriginalWidth, currentOriginalHeight) * 0.5; currentMesh.geometry = new THREE.BoxGeometry(currentOriginalWidth, currentOriginalHeight, depth); if(currentMesh.material){ currentMesh.material.depthTest = true; currentMesh.material.depthWrite = true; } } else { currentMesh.geometry = new THREE.PlaneGeometry(currentOriginalWidth, currentOriginalHeight, 1, 1); if(currentMesh.material){ currentMesh.material.depthTest = false; currentMesh.material.depthWrite = false; } } currentMesh.updateMatrix(); });
            document.getElementById('stretch-btn').addEventListener('click', function() { isStretchMode = !isStretchMode; this.classList.toggle('active-mode', isStretchMode); });
        }

        function clearObject() {
            if (currentMesh) { scene.remove(currentMesh); if (currentMesh.geometry) currentMesh.geometry.dispose(); if (currentMesh.material) currentMesh.material.dispose(); currentMesh = null; }
            if (currentVideo) { currentVideo.pause(); currentVideo.removeAttribute('src'); currentVideo.load(); currentVideo = null; }
        }

        function revealUI() { uiHidden = false; document.body.classList.remove('ui-hidden'); tempRevealBtn.style.display = 'none'; }
        
        function handleFileSelect(event) {
            const file = event.target.files[0]; if (!file) return; clearObject(); 
            const url = URL.createObjectURL(file); const fileType = file.type.split('/')[0];
            controlsPanel.classList.remove('hidden'); controlsPanel.classList.add('flex'); document.getElementById('size-controls').style.display = 'flex';
            document.getElementById('clean-view-btn').classList.remove('hidden'); document.getElementById('dist-container').classList.remove('hidden');
            if (fileType === 'image') { processImage(url); playBtn.style.display = 'none'; document.getElementById('seek-container').classList.add('hidden'); } 
            else if (fileType === 'video') { processVideo(url); playBtn.style.display = 'flex'; document.getElementById('seek-container').classList.remove('hidden'); playIcon.classList.add('hidden'); pauseIcon.classList.remove('hidden'); }
        }

        function processImage(url) { 
            const img = new Image();
            img.onload = () => {
                const MAX_DIMENSION = 512; let w = img.width; let h = img.height;
                if (w > MAX_DIMENSION || h > MAX_DIMENSION) { const ratio = Math.min(MAX_DIMENSION / w, MAX_DIMENSION / h); w = Math.floor(w * ratio); h = Math.floor(h * ratio); }
                const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                const texture = new THREE.CanvasTexture(canvas); texture.colorSpace = THREE.SRGBColorSpace; texture.minFilter = THREE.LinearFilter; texture.generateMipmaps = false; texture.anisotropy = 1;
                createMesh(texture, w, h);
            }; img.src = url;
        }
        
        function processVideo(url) { 
            const video = document.createElement('video'); video.src = url; video.crossOrigin = 'anonymous'; video.loop = true; video.playsInline = true; video.muted = false; 
            video.addEventListener('loadedmetadata', () => { 
                seekBar.max = video.duration; durationTimeEl.innerText = formatTime(video.duration); 
                const texture = new THREE.VideoTexture(video); texture.colorSpace = THREE.SRGBColorSpace; texture.minFilter = THREE.LinearFilter; texture.generateMipmaps = false;
                currentVideo = video; createMesh(texture, video.videoWidth, video.videoHeight); 
            }); 
            let lastUITime = 0; video.addEventListener('timeupdate', () => { if (uiHidden) return; const now = performance.now(); if (now - lastUITime > 500) { seekBar.value = video.currentTime; currentTimeEl.innerText = formatTime(video.currentTime); lastUITime = now; } }); 
            video.play().catch(e => { playIcon.classList.remove('hidden'); pauseIcon.classList.add('hidden'); }); 
        }

        function createMesh(texture, width, height) { 
            const aspectRatio = width / height; currentOriginalHeight = 1.0; currentOriginalWidth = currentOriginalHeight * aspectRatio; 
            const geometry = new THREE.PlaneGeometry(currentOriginalWidth, currentOriginalHeight, 1, 1); 
            
            // متریال بسیار سبک و بدون نیاز به پردازش نور محیط
            const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true, depthTest: false, depthWrite: false, precision: 'lowp' }); 
            
            currentMesh = new THREE.Mesh(geometry, material); currentMesh.matrixAutoUpdate = false; 
            currentMesh.frustumCulled = true; 
            if (renderer.xr.isPresenting) needsArReposition = true; else currentMesh.position.set(0, 0, -parseFloat(distSlider.value));
            currentMesh.updateMatrix(); scene.add(currentMesh); showToast("بارگذاری فوق بهینه شد"); 
        }
        
        function setupTouchGestures() {
            touchLayer.addEventListener('touchstart', (e) => {
                if (uiHidden) { if (revealMode === 'gesture' && e.touches.length === 4) revealUI(); else if (revealMode === 'button') { tempRevealBtn.style.display = 'block'; clearTimeout(revealTimer); revealTimer = setTimeout(() => tempRevealBtn.style.display = 'none', 2000); } }
                if (e.touches.length === 1) { isDragging = true; previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY }; } 
                else if (e.touches.length === 2 && currentMesh) { const dx = e.touches[0].clientX - e.touches[1].clientX; const dy = e.touches[0].clientY - e.touches[1].clientY; initialPinchDistance = Math.sqrt(dx * dx + dy * dy); initialScale.copy(currentMesh.scale); }
            }, { passive: false });
            
            touchLayer.addEventListener('touchmove', (e) => {
                e.preventDefault(); if (!currentMesh) return;
                if (e.touches.length === 1 && isDragging) { currentMesh.position.x += (e.touches[0].clientX - previousMousePosition.x) * 0.0025; currentMesh.position.y -= (e.touches[0].clientY - previousMousePosition.y) * 0.0025; currentMesh.updateMatrix(); previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
                if (e.touches.length === 2 && currentMesh) { const dist = Math.sqrt(Math.pow(e.touches[0].clientX - e.touches[1].clientX, 2) + Math.pow(e.touches[0].clientY - e.touches[1].clientY, 2)); const ratio = dist / initialPinchDistance; currentMesh.scale.set(initialScale.x * ratio, initialScale.y * ratio, initialScale.z * ratio); currentMesh.updateMatrix(); }
            }, { passive: false });
            touchLayer.addEventListener('touchend', () => isDragging = false);
        }
    </script>
</body>
